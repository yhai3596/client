<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈客户画像分析</title>
    <!-- Tailwind CSS CDN for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen font-sans text-gray-800">

    <!-- Header -->
    <header class="text-center pt-10 pb-6 text-white">
        <div class="flex items-center justify-center gap-3 mb-2">
            <i class="fa-solid fa-chart-line text-3xl text-yellow-300"></i>
            <h1 class="text-3xl font-bold tracking-wide">朋友圈客户画像分析</h1>
        </div>
        <p class="text-indigo-100 opacity-90">AI智能分析客户兴趣爱好，助力精准营销</p>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 pb-20 max-w-5xl">

        <!-- Upload Section -->
        <div id="upload-section" class="bg-white rounded-2xl shadow-2xl p-8 mb-8 transition-all duration-300">
            <div class="text-center mb-8">
                <h2 class="text-xl font-semibold text-gray-700 mb-2">上传客户朋友圈截图</h2>
                <p class="text-sm text-gray-500">为了获得更准确的画像，<span class="text-purple-600 font-bold">请至少上传 5 张</span> 有代表性的生活动态截图</p>
            </div>

            <!-- Drag & Drop Area -->
            <div id="drop-zone" class="border-2 border-dashed border-purple-300 rounded-xl bg-purple-50 p-10 text-center cursor-pointer hover:bg-purple-100 transition-colors group relative">
                <input type="file" id="file-input" multiple accept="image/*" class="hidden">
                <div class="pointer-events-none">
                    <i class="fa-solid fa-cloud-arrow-up text-5xl text-purple-400 mb-4 group-hover:scale-110 transition-transform"></i>
                    <p class="text-lg text-purple-700 font-medium">点击或拖拽图片到此处上传</p>
                    <p class="text-xs text-gray-400 mt-2">支持 JPG, PNG 格式</p>
                </div>
            </div>

            <!-- Preview Area -->
            <div id="preview-area" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4 mt-6 hidden">
                <!-- Preview items will be injected here -->
            </div>

            <!-- Action Buttons -->
            <div class="mt-8 flex justify-center">
                <button id="analyze-btn" disabled class="bg-gray-300 text-white px-10 py-3 rounded-full font-bold text-lg shadow-lg transform transition-all disabled:cursor-not-allowed hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 开始智能分析
                </button>
            </div>
            
            <p class="text-center text-xs text-gray-400 mt-4">
                <i class="fa-solid fa-shield-halved mr-1"></i> 数据隐私保护：上传图片仅用于单次分析，服务器不保留任何数据
            </p>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex flex-col items-center justify-center hidden backdrop-blur-sm">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-purple-500 mb-4"></div>
            <h3 class="text-white text-xl font-semibold">正在深度解析朋友圈内容...</h3>
            <p class="text-gray-300 text-sm mt-2" id="loading-text">识别生活场景...</p>
        </div>

        <!-- Report Section (Initially Hidden) -->
        <div id="report-section" class="bg-white rounded-2xl shadow-2xl overflow-hidden hidden animate-fade-in-up">
            
            <!-- Report Header -->
            <div class="border-b border-gray-100 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-purple-100 p-2 rounded-lg">
                        <i class="fa-solid fa-user-tie text-purple-600 text-xl"></i>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">客户画像分析报告</h2>
                </div>
                <div class="flex gap-3">
                    <button onclick="resetAnalysis()" class="px-4 py-2 border border-purple-200 text-purple-600 rounded-lg hover:bg-purple-50 text-sm font-medium transition-colors">
                        <i class="fa-solid fa-rotate-right mr-1"></i> 重新分析
                    </button>
                    <button onclick="exportReport()" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm font-medium shadow-md transition-colors">
                        <i class="fa-solid fa-download mr-1"></i> 导出报告
                    </button>
                </div>
            </div>

            <!-- Core Insight -->
            <div class="p-6">
                <div class="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl p-6 text-white shadow-lg relative overflow-hidden">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
                    <div class="relative z-10">
                        <h3 class="flex items-center gap-2 font-bold text-yellow-300 mb-3 text-lg">
                            <i class="fa-regular fa-lightbulb"></i> 核心洞察
                        </h3>
                        <p id="core-insight-text" class="text-indigo-50 leading-relaxed text-justify">
                            <!-- Dynamic Content -->
                        </p>
                    </div>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div class="px-6 border-b border-gray-100 overflow-x-auto">
                <nav class="flex gap-8" id="report-tabs">
                    <button class="tab-btn active" data-tab="basicInfo">基础信息</button>
                    <button class="tab-btn" data-tab="interests">兴趣爱好</button>
                    <button class="tab-btn" data-tab="personality">性格特征</button>
                    <button class="tab-btn" data-tab="psychology">心理画像</button>
                    <button class="tab-btn" data-tab="consumption">消费分析</button>
                    <button class="tab-btn" data-tab="riskOpportunity">风险机会</button>
                    <button class="tab-btn" data-tab="social">社交影响</button>
                    <button class="tab-btn" data-tab="strategy">销售策略</button>
                </nav>
            </div>

            <!-- Tab Content -->
            <div class="p-6 min-h-[300px] bg-gray-50">
                <!-- Basic Info Tab -->
                <div id="tab-basicInfo" class="tab-content active space-y-4">
                    <!-- Dynamic Content -->
                </div>

                <!-- Interests Tab -->
                <div id="tab-interests" class="tab-content hidden space-y-4">
                    <!-- Dynamic Content -->
                </div>

                <!-- Personality Tab -->
                <div id="tab-personality" class="tab-content hidden space-y-4">
                    <!-- Dynamic Content -->
                </div>

                <!-- Psychology Tab -->
                <div id="tab-psychology" class="tab-content hidden space-y-4">
                    <!-- Dynamic Content -->
                </div>

                <!-- Consumption Tab -->
                <div id="tab-consumption" class="tab-content hidden space-y-4">
                    <!-- Dynamic Content -->
                </div>

                <!-- Risk & Opportunity Tab -->
                <div id="tab-riskOpportunity" class="tab-content hidden space-y-4">
                    <!-- Dynamic Content -->
                </div>

                <!-- Social Tab -->
                <div id="tab-social" class="tab-content hidden space-y-4">
                    <!-- Dynamic Content -->
                </div>

                <!-- Strategy Tab -->
                <div id="tab-strategy" class="tab-content hidden space-y-4">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-white text-opacity-60 text-sm pb-8">
        &copy; 2025 Powered by Volcengine Doubao LLM
    </footer>

    <script src="script.js"></script>
</body>
</html>
